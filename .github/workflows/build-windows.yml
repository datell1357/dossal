name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller h2 psutil
    
    - name: Build EXE
      run: |
        pyinstaller --clean --onefile --windowed --name dossal --add-data "dossal.py:." --add-data "README.md:." --hidden-import h2 --hidden-import psutil dossal_gui.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dossal-windows
        path: dist/dossal.exe
