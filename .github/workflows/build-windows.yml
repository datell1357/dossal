name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: pip install pyinstaller h2 hpack hyperframe
    
    - name: Build CLI EXE
      run: pyinstaller --onefile --name dossal --clean --hidden-import h2 --hidden-import hpack --hidden-import hyperframe dossal.py
    
    - name: Build GUI EXE
      run: pyinstaller --onefile --name dossal-gui --windowed --clean --hidden-import h2 --hidden-import hpack --hidden-import hyperframe dossal_gui.py
    
    - name: Create ZIP
      run: |
        Compress-Archive -Path dist/dossal.exe, dist/dossal-gui.exe -DestinationPath dist/dossal-v15.9-windows.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dossal-v15.9-windows
        path: |
          dist/dossal.exe
          dist/dossal-gui.exe
          dist/dossal-v15.9-windows.zip
